name: packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_cmd: yarn package:desktop:linux-amd64
            verify_deb: true
          - os: windows-latest
            package_cmd: yarn package:desktop:windows-x64
            verify_deb: false
          - os: macos-latest
            package_cmd: yarn package:desktop:macos-x64
            verify_deb: false
          - os: macos-14
            package_cmd: yarn package:desktop:macos-arm64
            verify_deb: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build all
        run: yarn build:all
      - name: Package desktop app
        run: ${{ matrix.package_cmd }}
      - name: Verify deb layout
        if: matrix.verify_deb
        run: node developers/scripts/desktop/verify-deb-layout.js

  server-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build all
        run: yarn build:all
      - name: Package server deb
        run: yarn package:server-${{ matrix.arch }}