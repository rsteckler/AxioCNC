name: desktop

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build server
        run: yarn build:server
      - name: Build web
        run: yarn build:web
      - name: Build shared
        run: yarn build:shared
      - name: Build desktop runtime
        run: yarn build:desktop
      - name: Package desktop app
        run: yarn package:desktop
      - name: Verify deb layout
        if: matrix.os == 'ubuntu-latest'
        run: node developers/scripts/desktop/verify-deb-layout.js
