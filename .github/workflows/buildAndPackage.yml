name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_cmd: yarn package:desktop:linux-amd64
            verify_deb: true
          - os: windows-latest
            package_cmd: yarn package:desktop:windows-x64
            verify_deb: false
          - os: macos-latest
            package_cmd: yarn package:desktop:macos-x64
            verify_deb: false
          - os: macos-14
            package_cmd: yarn package:desktop:macos-arm64
            verify_deb: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present (e.g., v1.10.113 -> 1.10.113)
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"
      - name: Update version numbers
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node developers/scripts/update-version.js ${{ steps.tag_version.outputs.version }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build all
        run: yarn build:all
      - name: Package desktop app
        run: ${{ matrix.package_cmd }}
      - name: Verify deb layout
        if: matrix.verify_deb
        run: node developers/scripts/desktop/verify-deb-layout.js
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiocnc-desktop-${{ matrix.os }}
          path: out/*

  server-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present (e.g., v1.10.113 -> 1.10.113)
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build all
        run: yarn build:all
      - name: Package server deb
        run: yarn package:server-${{ matrix.arch }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiocnc-server-${{ matrix.arch }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, server-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Extract version from tag
        id: tag_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present (e.g., v1.10.113 -> 1.10.113)
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List release artifacts
        run: |
          echo "Release artifacts structure:"
          find release-artifacts -type f | head -20
          echo ""
          echo "Total files:"
          find release-artifacts -type f | wc -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.tag_name }}
          name: Release ${{ steps.tag_version.outputs.version }}
          body: |
            ## AxioCNC ${{ steps.tag_version.outputs.version }}
            
            ### Desktop Applications
            - Linux (amd64, arm64, armv7l)
            - Windows (x64)
            - macOS (x64, arm64)
            
            ### Server Packages
            - Debian/Ubuntu (amd64, arm64, armhf)
            
            See the [changelog](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref }}) for details.
          files: release-artifacts/**/*
          draft: false
          prerelease: ${{ contains(steps.tag_version.outputs.version, '-') }}