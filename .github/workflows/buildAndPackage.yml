name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Set repository name to lowercase
        id: repo
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$REPO_LOWER" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.package_version.outputs.version }}-${{ github.sha }}
            APTABASE_KEY=${{ secrets.APTABASE_KEY }}
            VITE_APTABASE_KEY=${{ secrets.APTABASE_KEY }}
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_cmd: pnpm package:desktop:linux-amd64
            verify_deb: true
          - os: windows-latest
            package_cmd: pnpm package:desktop:windows-x64
            verify_deb: false
          - os: macos-latest
            package_cmd: pnpm package:desktop:macos-x64
            verify_deb: false
          - os: macos-14
            package_cmd: pnpm package:desktop:macos-arm64
            verify_deb: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Aptabase key config (backend)
        run: node developers/scripts/generate-aptabase-key.js
        env:
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
      - name: Build all
        run: pnpm build:all
        env:
          VITE_APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
      - name: Package desktop app
        run: ${{ matrix.package_cmd }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiocnc-desktop-${{ matrix.os }}
          path: out/*

  server-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Aptabase key config (backend)
        run: node developers/scripts/generate-aptabase-key.js
        env:
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
      - name: Build all
        run: pnpm build:all
        env:
          VITE_APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
      - name: Package server deb
        run: pnpm package:server-${{ matrix.arch }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiocnc-server-${{ matrix.arch }}
          path: out/*
