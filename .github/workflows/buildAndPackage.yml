name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_cmd: pnpm package:desktop:linux-amd64
            verify_deb: true
          - os: windows-latest
            package_cmd: pnpm package:desktop:windows-x64
            verify_deb: false
          - os: macos-latest
            package_cmd: pnpm package:desktop:macos-x64
            verify_deb: false
          - os: macos-14
            package_cmd: pnpm package:desktop:macos-arm64
            verify_deb: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all
        run: pnpm build:all
      - name: Package desktop app
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" || "${{ matrix.os }}" == "macos-14" ]]; then
            ulimit -n 4096
          fi
          ${{ matrix.package_cmd }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiocnc-desktop-${{ matrix.os }}
          path: out/*

  server-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all
        run: pnpm build:all
      - name: Package server deb
        run: pnpm package:server-${{ matrix.arch }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiocnc-server-${{ matrix.arch }}
          path: out/*
