# Workflow for building and deploying website (static + Docusaurus docs) to GitHub Pages
name: Deploy Website

on:
  push:
    branches: ["main"]
    paths:
      - 'website/**'
      - 'developers/docs/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build User Docs Docusaurus
        working-directory: website/docs
        env:
          GISCUS_REPO: ${{ secrets.GISCUS_REPO || 'rsteckler/AxioCNC-Docs' }}
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ secrets.GISCUS_CATEGORY || 'Announcements' }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
        run: yarn build

      - name: Build Dev Docs Docusaurus
        working-directory: website/devdocs
        run: yarn build

      - name: Prepare deployment
        run: |
          mkdir -p _site/docs _site/devdocs
          # Copy static website files to root
          cp -r website/static/* _site/ 2>/dev/null || true
          # Copy User Docs Docusaurus build output (with baseUrl='/docs/', files are in build/ directly)
          if [ -d "website/docs/build" ]; then
            cp -r website/docs/build/* _site/docs/
          fi
          # Copy Dev Docs Docusaurus build output (with baseUrl='/devdocs/', files are in build/ directly)
          if [ -d "website/devdocs/build" ]; then
            cp -r website/devdocs/build/* _site/devdocs/
          fi
          # Create index.html redirect for /docs/ to /docs/intro/
          # Docusaurus with routeBasePath='/' doesn't create /docs/index.html
          cat > _site/docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=/docs/intro/">
            <link rel="canonical" href="/docs/intro/">
          </head>
          <body>
            <script>window.location.href='/docs/intro/';</script>
          </body>
          </html>
          EOF
          # Create index.html redirect for /devdocs/ to /devdocs/intro/
          cat > _site/devdocs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=/devdocs/intro/">
            <link rel="canonical" href="/devdocs/intro/">
          </head>
          <body>
            <script>window.location.href='/devdocs/intro/';</script>
          </body>
          </html>
          EOF
          # Ensure .nojekyll for GitHub Pages
          touch _site/.nojekyll _site/docs/.nojekyll _site/devdocs/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
