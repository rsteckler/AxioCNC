# Workflow for building and deploying website (static + Docusaurus docs) to GitHub Pages
name: Deploy Website

on:
  push:
    branches: ["main"]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Docusaurus
        working-directory: website/docs
        env:
          GISCUS_REPO: ${{ secrets.GISCUS_REPO || 'rsteckler/AxioCNC-Docs' }}
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ secrets.GISCUS_CATEGORY || 'Announcements' }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
        run: yarn build

      - name: Prepare deployment
        run: |
          mkdir -p _site/docs
          # Copy static website files to root
          cp -r website/static/* _site/ 2>/dev/null || true
          # Copy Docusaurus build output (with baseUrl='/docs/', content is in build/docs/)
          if [ -d "website/docs/build/docs" ]; then
            cp -r website/docs/build/docs/* _site/docs/
          fi
          # Copy assets (CSS, JS, images)
          if [ -d "website/docs/build/assets" ]; then
            cp -r website/docs/build/assets _site/docs/
          fi
          # Copy root-level files (favicon, etc.)
          find website/docs/build -maxdepth 1 -type f ! -name '*.map' -exec cp {} _site/docs/ \; 2>/dev/null || true
          # Ensure .nojekyll for GitHub Pages
          touch _site/.nojekyll _site/docs/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
